name: Personal extension
on:
  workflow_dispatch:
  push:
    branches: [personal]
  pull_request:
    branches: [personal]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test personal/tests/*.test.mjs
      - run: node personal/scripts/build.mjs
      - run: for script in .scratch/extension/*.js .scratch/extension/personal/*.js; do node --check "$script"; done
